volumes:
  mysql_data:

networks:
  all_dir_network:
    driver: bridge

services:
  database:
    container_name: database
    image: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=shawshank
      - MYSQL_DATABASE=todo
      - MYSQL_USER=guest
      - MYSQL_PASSWORD=shawshank
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - all_dir_network
    command:
      --bind-address=0.0.0.0
  backend:
    container_name: server
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/todo
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=shawshank
    networks:
      - all_dir_network
    depends_on:
      - database
  frontend:
    container_name: frontend
    build: 
      context: ./frontend
    ports:
      - "3000:80"
    networks:
      - all_dir_network
    depends_on:
      - backend
  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    networks:
      - all_dir_network
    depends_on:
      - frontend