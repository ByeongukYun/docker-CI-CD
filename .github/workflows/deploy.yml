name: docker, ci/cd, ec2, hub

on:
    push:
        branches:
            - dev

jobs:
    docker-cicd:
        runs-on: ubuntu-latest
        steps:
            - name: code checkout
              uses: actions/checkout@v4

            - name: install jdk 17
              uses: actions/setup-java@v4
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: check current status
              run: |
                pwd
                ls

            - name: apply action for docker build
              uses: docker/setup-buildx-action@v3

            - name: sign in docker hub
              run: echo "${{ secrets.HUB_DOCKER_TOKEN }}" | docker login -u "${{ secrets.HUB_DOCKER_NAME }}" --password-stdin

            - name: create backend image -> push to repo(hub)
              run: |
                docker build -t byeongukyun/demo_backend ./backend
                docker push byeongukyun/demo_backend

            - name: create frontend image -> push to repo(hub)
              run: |
                docker build -t byeongukyun/demo_frontend ./frontend
                docker push byeongukyun/demo_frontend

            - name: upload files on EC2
              uses: appleboy/scp-action@v0.1.7
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USER }}
                key: ${{ secrets.EC2_KEY }}
                source: |
                  docker-compose.yml,
                  ./nginx/default.conf
                target: /home/ubuntu

    deploy:
      runs-on: ubuntu-latest
      needs: docker-cicd
      steps:
        - name: connect EC2 by SSH -> docker compose
          uses: appleboy/ssh-action@v1.1.0
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_KEY }}
            script_stop: true
            script: |
              sudo docker compose down
              sudo docker compose up -d